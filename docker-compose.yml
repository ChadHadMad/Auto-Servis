version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - haproxy
    networks:
      - autoservis-net

  haproxy:
    image: haproxy:2.9
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - api1
      - api2
    networks:
      - autoservis-net

  api1:
    build: ./services/api
    environment:
      API_NAME: ap1
      RABBIT_HOST: rabbitmq
      RABBIT_QUEUE: order_status_events
      SEED_ADMIN_EMAIL: admin@autoservis.com
      SEED_ADMIN_PASSWORD: admin123
    networks:
      - autoservis-net

  api2:
    build: ./services/api
    environment:
      API_NAME: ap2
      RABBIT_HOST: rabbitmq
      RABBIT_QUEUE: order_status_events
      SEED_ADMIN_EMAIL: admin@autoservis.com
      SEED_ADMIN_PASSWORD: admin123
    networks:
      - autoservis-net

  worker:
    build: ./services/api
    command: ["python", "-u", "worker.py"]
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_QUEUE: order_status_events
      BOSS_EMAIL: tomc.matija@gmail.com
      EMAIL_FROM: smiklosevic.smm@gmail.com
      EMAIL_PASS: luhnaylpbgiwfxvk
    depends_on:
      - rabbitmq
    networks:
      - autoservis-net

  postfix-relay:
    build: ./services/postfix-relay
    volumes:
      - ./services/postfix-relay/resolv.conf:/etc/resolv.conf:ro
    networks:
      - autoservis-net

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: servis
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    networks:
      - autoservis-net

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - autoservis-net

  memcached:
    image: memcached:alpine
    networks:
      - autoservis-net

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - autoservis-net

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    networks:
      - autoservis-net

  airflow-webserver:
    image: apache/airflow:2.7.1
    user: "0:0"
    restart: always
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user:pass@db:5432/servis
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: 50000
      AIRFLOW_GID: 50000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/data:/opt/airflow/data
      - ./airflow/entrypoint.sh:/entrypoint.sh
    command: ["bash", "/entrypoint.sh", "webserver"]
    networks:
      - autoservis-net

  airflow-scheduler:
    image: apache/airflow:2.7.1
    user: "0:0"
    restart: always
    depends_on:
      - airflow-webserver
      - db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user:pass@db:5432/servis
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: 50000
      AIRFLOW_GID: 50000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/data:/opt/airflow/data
      - ./airflow/entrypoint.sh:/entrypoint.sh
    command: ["bash", "/entrypoint.sh", "scheduler"]
    networks:
      - autoservis-net

  airflow-exporter:
    build: ./airflow-exporter
    environment:
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
    depends_on:
      - airflow-webserver
    networks:
      - autoservis-net
    ports:
      - "9112:9112"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - autoservis-net


  # ── RAG chatbot servisi ──────────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - autoservis-net

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - autoservis-net

  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull llama3.2 &&
        echo 'Model spreman.'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - autoservis-net
    restart: on-failure

  rag-api:
    build: ./rag-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ADMIN_KEY=${ADMIN_KEY}
      - JWT_SECRET=change-me-in-prod
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - MONGO_URL=mongodb://mongodb:27017
      - MONGO_DB=autoservis
    volumes:
      - rag-data:/app/data
    depends_on:
      - qdrant
      - ollama
      - mongodb
    networks:
      - autoservis-net

networks:
  autoservis-net:
    driver: bridge

volumes:
  qdrant-storage:
  ollama-models:
  rag-data:
  mongodb-data: