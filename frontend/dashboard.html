<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <title>Autoservis – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1916; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .box { background: #fff; border: 0.5px solid #e0ddd8; border-radius: 14px; padding: 32px 36px; text-align: center; max-width: 380px; width: 100%; margin: 20px; }
    .box h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .box p { color: #6b6860; font-size: 13px; margin-bottom: 20px; }
    .spinner { margin: 16px auto; width: 32px; height: 32px; border: 3px solid #e0ddd8; border-top-color: #1a1916; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info { color: #6b6860; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>AutoServis</h2>
    <p>Provjera prijave i uloge…</p>
    <div class="spinner"></div>
    <div class="info" id="info"></div>
  </div>

  <script>
    (function init() {
      const token = localStorage.getItem("token");
      const role  = localStorage.getItem("role");
      if (!token || !role) { window.location.href = "/index.html"; return; }
      document.getElementById("info").textContent = "Uloga: " + role + " – preusmjeravam…";
      setTimeout(() => {
        if (role === "customer")  window.location.href = "/customer.html";
        else if (role === "mechanic") window.location.href = "/mechanic.html";
        else if (role === "admin")    window.location.href = "/admin.html";
        else document.getElementById("info").textContent = "Nepoznata uloga: " + role;
      }, 500);
    })();
  </script>
  <script src="/nav.js"></script>
</body>
</html>
