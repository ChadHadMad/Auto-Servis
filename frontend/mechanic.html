<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Autoservis – Mehaničar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1916; font-size: 14px; }

    .page { max-width: 1200px; margin: 0 auto; padding: 32px 20px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .page-sub { font-size: 12px; color: #6b6860; margin-top: 2px; }
    .whoami { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: #f0eeea; border: 0.5px solid #e0ddd8; color: #6b6860; }

    .card { background: #fff; border: 0.5px solid #e0ddd8; border-radius: 14px; padding: 22px; }
    .card-title { font-size: 11px; font-weight: 700; color: #6b6860; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

    .btn { padding: 7px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .btn:hover { opacity: 0.85; }
    .btn-secondary { background: #f0eeea; color: #1a1916; border: 0.5px solid #e0ddd8; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 11px; color: #9c9990; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 8px 8px 0; border-bottom: 0.5px solid #e0ddd8; }
    td { padding: 10px 8px 10px 0; border-bottom: 0.5px solid #f0eeea; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }

    .status-scheduled { color:#444; }
    .status-waiting   { color:#1a5fa8; font-weight:600; }
    .status-on_lift   { color:#b85c00; font-weight:600; }
    .status-done      { color:#1a6b3a; font-weight:600; }
    .status-cancelled { color:#c0392b; font-weight:600; }

    select.inline { padding: 5px 8px; font-size: 12px; border: 0.5px solid #ccc9c3; border-radius: 6px; font-family: inherit; outline: none; }
    select.inline:focus { border-color: #1a1916; }

    .msg { margin-top: 12px; font-size: 13px; padding: 8px 12px; border-radius: 8px; }
    .msg-ok  { background: #edf6f1; border: 0.5px solid #a8d8ba; color: #1a6b3a; }
    .msg-err { background: #fdf0ef; border: 0.5px solid #f5c6c2; color: #c0392b; }
    .muted { font-size: 12px; color: #9c9990; }
  </style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Mehaničarski panel</div>
      <div class="page-sub">Pregled i ažuriranje statusa svih narudžbi</div>
    </div>
    <span class="whoami" id="whoami">…</span>
  </div>

  <div class="card">
    <div class="card-title">
      Sve narudžbe
      <button class="btn btn-secondary" onclick="loadOrders()">↻ Osvježi</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Klijent</th><th>Vozilo</th><th>Datum</th><th>Bilješke</th><th>Status</th><th>Promijeni</th>
        </tr>
      </thead>
      <tbody id="ordersTbody">
        <tr><td colspan="6" class="muted">Učitavam…</td></tr>
      </tbody>
    </table>
    <div id="ordersMsg"></div>
  </div>
</div>

<script>
  const API = "/api";
  const token = () => localStorage.getItem("token");
  const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  const STATUS_LABELS = { scheduled:"Auto mora doći", waiting:"Čeka u servisu", on_lift:"Na dizalici", done:"Gotovo", cancelled:"Otkazano" };
  const statusLabel = s => STATUS_LABELS[s] || s;
  const statusOptions = cur => ["scheduled","waiting","on_lift","done","cancelled"]
    .map(s=>`<option value="${s}" ${s===cur?"selected":""}>${statusLabel(s)}</option>`).join("");

  function setMsg(text, ok) {
    const el = document.getElementById("ordersMsg");
    el.textContent = text;
    el.className = "msg " + (ok ? "msg-ok" : "msg-err");
  }

  (function init() {
    const t = token(), r = localStorage.getItem("role");
    if (!t || !r) { window.location.href = "/index.html"; return; }
    if (r !== "mechanic") { window.location.href = "/dashboard.html"; return; }
    loadMe(); loadOrders();
  })();

  async function loadMe() {
    const r = await fetch(`${API}/auth/me`, { headers: { "Authorization": "Bearer " + token() } });
    const d = await r.json();
    document.getElementById("whoami").textContent = d.email + " (" + d.role + ")";
  }

  async function loadOrders() {
    const r = await fetch(`${API}/orders`, { headers: { "Authorization": "Bearer " + token() } });
    const data = await r.json();
    if (!r.ok) { setMsg(JSON.stringify(data?.detail)); return; }
    const tbody = document.getElementById("ordersTbody");
    if (!data.length) { tbody.innerHTML = `<tr><td colspan="6" class="muted">Nema narudžbi.</td></tr>`; return; }
    tbody.innerHTML = data.map(o => {
      const notes = (o.notes||"").slice(0,40) + ((o.notes||"").length>40?"…":"");
      return `<tr>
        <td>${esc(o.customer_name)}</td>
        <td>${esc(o.vehicle)}</td>
        <td style="white-space:nowrap;">${o.service_date}</td>
        <td title="${esc(o.notes||"")}">${esc(notes||"—")}</td>
        <td class="status-${o.status}">${statusLabel(o.status)}</td>
        <td><select class="inline" onchange="updateStatus('${o.id}',this.value)">${statusOptions(o.status)}</select></td>
      </tr>`;
    }).join("");
  }

  async function updateStatus(id, status) {
    const r = await fetch(`${API}/orders/${id}/status?status=${status}`, { method:"PUT", headers:{"Authorization":"Bearer "+token()} });
    const d = await r.json();
    setMsg(r.ok ? `Status → "${statusLabel(status)}"` : `Greška: ${JSON.stringify(d?.detail)}`, r.ok);
    if (r.ok) loadOrders();
  }
</script>
<script src="/nav.js"></script>
</body>
</html>
